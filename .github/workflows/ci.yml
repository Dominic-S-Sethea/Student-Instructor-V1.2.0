# ============================================================================
# CI/CD pipeline — CDES Student-Instructor-V1.2.0
#
# Job order & gates:
#   1. install                 — npm ci (reproducible lockfile contract)
#   2. lint+typecheck          — npm run lint (root + tsconfig.server.json)
#   3. build                   — vite (dist/public) + esbuild (dist/server/server.cjs) + DB assets
#   4. test                    — npm test + npm run test:coverage (all suites, GEMINI_API_KEY="")
#   5. verify-start            — production smoke: /api/health 200 (ready, schemaVersion>=10, integrity=ok)
#   6. dependency-audit-gate   — npm audit hard gate (high/critical) + baseline regression check
#   7. secret-scan-gate        — gitleaks v8 with .github/.gitleaks.toml + SARIF upload
#   8. staging-deploy          — mirrors prod build; verifies /api/health + clean teardown
# ============================================================================
name: CI

on:
  push:
    branches: [ main, feat/ci-cd-scaffolding ]
  pull_request:
    branches: [ main, feat/ci-cd-scaffolding ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  install:
    name: Install · npm ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify lockfile contract
        run: |
          test -f package-lock.json
          test -d node_modules

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript strict typecheck (frontend + server)
        run: npm run lint

  build:
    name: Build · vite + esbuild → dist/server/server.cjs
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Unit + integration + SEC-001 + coverage
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run full test suite & V8 coverage
        env:
          GEMINI_API_KEY: ""
        run: |
          npm test
          npm run test:coverage

  verify-start:
    name: Verify start script + /api/health
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke start (aiEnabled=false, migrations & integrity verified)
        run: |
          export NODE_ENV=production
          export GEMINI_API_KEY=""
          export DATABASE_PATH="/tmp/verify-start-cdes-${{ github.run_id }}.db"
          rm -f "${DATABASE_PATH}"*
          npm start > verify-start.log 2>&1 &
          SRV=$!
          echo "VERIFY_SRV_PID=$SRV" >> "$GITHUB_ENV"
          echo "VERIFY_DB_PATH=$DATABASE_PATH" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/verify-start-health.json 2>/dev/null; then
              break
            fi
            if ! kill -0 "$SRV" 2>/dev/null; then
              echo "server exited early" >&2
              cat verify-start.log >&2
              exit 1
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/verify-start-health.json'))
          assert d['status'] == 'ok', d
          assert d['ready'] is True, d
          assert d['aiEnabled'] is False, 'health must report aiEnabled=false when GEMINI_API_KEY is unset'
          db = d.get('database', {})
          assert db.get('integrity') == 'ok', d
          assert db.get('foreignKeys') is True, d
          assert int(db.get('schemaVersion', 0)) >= 10, d
          print('health payload OK:', json.dumps(d, sort_keys=True))
          PY

          if ! grep -q "Database initialized and migrations verified" verify-start.log; then
            echo "migrations did not run" >&2
            cat verify-start.log >&2
            exit 1
          fi

          kill "$SRV" 2>/dev/null || true
          wait "$SRV" 2>/dev/null || true
      - name: Clean up verify-start artifacts
        if: always()
        run: |
          if [ -n "${VERIFY_SRV_PID:-}" ]; then
            kill "$VERIFY_SRV_PID" 2>/dev/null || true
          fi
          rm -f "${VERIFY_DB_PATH:-/tmp/verify-start-cdes}"* /tmp/verify-start-health.json

  dependency-audit-gate:
    name: Dependency audit (hard + regression)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Capture current dependency audit snapshot
        run: npm audit --omit=dev --json > audit-current.json || true
      - name: Hard dependency audit (fails on high/critical)
        run: npm audit --omit=dev
        env:
          npm_config_audit_level: high
      - name: Regression check (fails on NEW high/critical)
        run: node .github/scripts/check-audit-baseline.cjs
      - name: Upload baseline artifact (14-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-baseline
          path: audit-baseline.json
          retention-days: 14

  baseline-sync:
    name: Refresh committed audit baseline (main)
    runs-on: ubuntu-latest
    needs: dependency-audit-gate
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Fresh baseline from current audit
        run: |
          npm audit --omit=dev --json > audit-baseline.json || true
      - name: Commit refreshed baseline
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@cdes.local"
          git add audit-baseline.json
          if git diff --quiet HEAD -- audit-baseline.json; then
            echo "baseline unchanged"
          else
            git commit -s -m "ci: refresh dependency audit baseline" || echo "no changes to commit"
          fi

  secret-scan-gate:
    name: Secret scan · gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with .github/.gitleaks.toml
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/.gitleaks.toml
      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version": "2.1.0", "runs": []}' > results.sarif
          fi
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  staging-deploy:
    name: Staging deploy · /api/health (aiEnabled=false)
    runs-on: ubuntu-latest
    environment: staging
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Provision staging config (mirrors prod)
        run: |
          DB_PATH="/tmp/staging-cdes-${{ github.run_id }}.db"
          rm -f "${DB_PATH}"*
          echo "NODE_ENV=staging" >> "$GITHUB_ENV"
          echo "DATABASE_PATH=$DB_PATH" >> "$GITHUB_ENV"
          echo "COOKIE_SECURE=false" >> "$GITHUB_ENV"
      - name: Start production build in staging
        run: |
          npm start > staging.log 2>&1 &
          SRV=$!
          echo "STAGING_PID=$SRV" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/staging-health.json 2>/dev/null; then
              break
            fi
            if ! kill -0 "$SRV" 2>/dev/null; then
              echo "staging server exited early" >&2
              cat staging.log >&2
              exit 1
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/staging-health.json'))
          assert d['status'] == 'ok', d
          assert d['ready'] is True, d
          assert d['aiEnabled'] is False, d
          db = d.get('database', {})
          assert db.get('integrity') == 'ok', d
          assert db.get('foreignKeys') is True, d
          assert int(db.get('schemaVersion', 0)) >= 10, d
          print('staging health OK:', json.dumps(d, sort_keys=True))
          PY

          if ! grep -q "Database initialized and migrations verified" staging.log; then
            echo "migrations did not run in staging" >&2
            cat staging.log >&2
            exit 1
          fi

          kill "$SRV" 2>/dev/null || true
          wait "$SRV" 2>/dev/null || true
      - name: Tear down staging artifacts
        if: always()
        run: |
          if [ -n "${STAGING_PID:-}" ]; then
            kill "$STAGING_PID" 2>/dev/null || true
          fi
          rm -f /tmp/staging-cdes-*.db* /tmp/staging-health.json
