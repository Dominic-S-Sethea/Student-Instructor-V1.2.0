# Gitleaks v8 configuration for CDES CI secret-scan gate.
title = "CDES Student-Instructor V1.2.0 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Exclude lockfiles, build outputs, and committed dependency-audit baseline metadata"
paths = [
  '''package-lock\.json$''',
  '''audit-baseline\.json$''',
  '''^dist/''',
  '''^node_modules/''',
]
stopwords = [
  "placeholder",
  "example",
  "your_api_key",
]
