services:
  cdes-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdes-student-instructor:1.2.0
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: /data/cdes_platform.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET:?Set a strong 32+ character JWT_SECRET in your runtime environment}
      RESEARCH_SALT: ${RESEARCH_SALT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - cdes_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cdes_data:
